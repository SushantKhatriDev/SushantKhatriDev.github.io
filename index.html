border-color:#ff0077;

}

<body>


<canvas id="starfield"></canvas>

<div class="overlay"></div>


<div class="panel">

</div>

</div>

</div>

[SYS] Waiting for launch authorization...

</div>

🚀 START SYSTEM AUDIO
</button>

<script>


// STARFIELD


const canvas=document.getElementById("starfield");

const ctx=canvas.getContext("2d");


canvas.width=innerWidth;
canvas.height=innerHeight;


let stars=[];


for(let i=0;i<200;i++){

stars.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

z:Math.random()*canvas.width

});

}



function starsLoop(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";


stars.forEach(s=>{


s.z-=2;


if(s.z<1){

s.z=canvas.width;

}



let k=200/s.z;


let x=(s.x-canvas.width/2)*k+canvas.width/2;

let y=(s.y-canvas.height/2)*k+canvas.height/2;



ctx.beginPath();

ctx.arc(x,y,2,0,Math.PI*2);

ctx.fill();



});


requestAnimationFrame(starsLoop);

}


starsLoop();





// AUDIO


let audio;


function startAudio(){


audio=new AudioContext();



const bootSounds=[

[400,.1],

[600,.1],

[800,.1],

[1000,.2]

];



bootSounds.forEach((s,i)=>{


setTimeout(()=>{


let osc=audio.createOscillator();

let gain=audio.createGain();



osc.frequency.value=s[0];

osc.type="square";


gain.gain.value=.05;


osc.connect(gain);

gain.connect(audio.destination);



osc.start();


osc.stop(audio.currentTime+s[1]);



},i*400);



});


}



document.getElementById("boot").onclick=()=>{


startAudio();


document.getElementById("hud").innerHTML=

`
[OK] Audio drivers initialized.<br>
[OK] Starfield engine online.<br>
[OK] Navigation system ready.
`;



document.getElementById("boot").innerHTML=

"✔ SYSTEM ONLINE";


};





// MOUSE GRID


document.onmousemove=e=>{


document.getElementById("coord").innerHTML=

`GRID:X-${Math.floor(e.clientX/innerWidth*100)}
Y-${Math.floor(e.clientY/innerHeight*100)}`;


};



</script>
