<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushant Khatri Dev</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .badge {
            background: #334155;
            color: #f8fafc;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
            margin: 5px;
        }
        .links { margin-top: 30px; }
        .btn {
            display: block;
            background: #2563eb;
            color: white;
            padding: 12px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn.youtube { background: #dc2626; }
        .btn.youtube:hover { background: #b91c1c; }
        .btn.gitlab { background: #e24329; }
        .btn.gitlab:hover { background: #fc6d26; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sushant Khatri</h1>
    <p>Runexel Dev | Software Developer</p>
    
    <div>
        <span class="badge">🧠 CS50x</span>
        <span class="badge">🐍 CodeInPlace</span>
        <span class="badge">🎮 Game Design</span>
    </div>

    <div class="links">
        <a class="btn youtube" href="https://www.youtube.com/@Sutolix" target="_blank">🎬 Sutolix YouTube</a>
        <a class="btn youtube" href="https://www.youtube.com/@Runexel" target="_blank">💻 Runexel Coding Channel</a>
        <a class="btn gitlab" href="https://gitlab.com/SushantKhatri" target="_blank">🦊 GitLab Profile</a>
        <a class="btn" href="https://sushantkhatridev.blogspot.com" target="_blank">📝 Tech & Dev Blog</a>
    </div>
</div>

</body>
</html>
