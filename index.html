<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUSHANT_KHATRI.DEV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #05050a;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Scanline glitch effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .terminal-container {
            width: 100%;
            max-width: 900px;
            background: rgba(10, 10, 20, 0.9);
            border: 2px solid #00ff66;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
        }

        /* Big animated header */
        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff66;
            animation: pulse 2s infinite alternate;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #38bdf8;
            margin-bottom: 30px;
            border-right: 2px solid #38bdf8;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 3.5s steps(40, end) forwards, blink 0.75s step-end infinite;
        }

        /* Interactive Javascript Section */
        .terminal-log {
            background: #000;
            border-left: 3px solid #38bdf8;
            padding: 15px;
            margin-bottom: 35px;
            font-size: 0.95rem;
            color: #a7f3d0;
            min-height: 100px;
        }

        /* Big Neon Buttons */
        .grid-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-links { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
        }

        .neon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            border: 2px solid #00ff66;
            color: #00ff66;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Javascript dynamically targets these on hover */
        .neon-btn:hover {
            color: #05050a;
            background: #00ff66;
            box-shadow: 0 0 20px #00ff66, 0 0 40px #00ff66;
            transform: translateY(-3px);
        }

        .neon-btn.yt {
            border-color: #ff0055;
            color: #ff0055;
        }
        .neon-btn.yt:hover {
            background: #ff0055;
            box-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            color: #fff;
        }

        /* Animations */
        @keyframes pulse {
            from { text-shadow: 0 0 5px #00ff66, 0 0 10px #00ff66; }
            to { text-shadow: 0 0 15px #00ff66, 0 0 30px #00ff66; }
        }
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #38bdf8; }
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <h1 id="main-title">SUSHANT_KHATRI</h1>
    <div class="subtitle">> CS50x // CODEINPLACE // GAME_DEV_INIT...</div>

    <!-- JavaScript injects logs here dynamically -->
    <div class="terminal-log" id="log-box">
        [SYSTEM] Initializing Runexel Workspace...<br>
    </div>

    <div class="grid-links">
        <a class="neon-btn yt" href="https://www.youtube.com/@Sutolix" target="_blank" data-info="Accessing Main Hub: Gaming challenges & Blox Fruits streams.">🎬 SUTOLIX YT</a>
        <a class="neon-btn yt" href="https://www.youtube.com/@Runexel" target="_blank" data-info="Accessing Dev Core: Code tutorials, scripts, and devlogs.">💻 RUNEXEL CODING</a>
        <a class="neon-btn" href="https://gitlab.com/SushantKhatri" target="_blank" data-info="Connecting to Fox-Net: Syncing open-source code repositories.">🦊 GITLAB HUB</a>
        <a class="neon-btn" href="https://sushantkhatridev.blogspot.com" target="_blank" data-info="Booting Intel Log: Reading recent tech & developer thoughts.">📝 DEV BLOG</a>
    </div>
</div>

<script>
    // Cool Interactive JavaScript Logic
    const logBox = document.getElementById('log-box');
    const buttons = document.querySelectorAll('.neon-btn');

    // Simulated background terminal logs
    const bootSequences = [
        "[OK] Python logic compiler active.",
        "[OK] C-Lang memory cells secure.",
        "[STATUS] Harvard CS50x routines running cleanly.",
        "[READY] Awaiting user command input..."
    ];

    let lineIndex = 0;
    function printBootLog() {
        if (lineIndex < bootSequences.length) {
            logBox.innerHTML += `<br>${bootSequences[lineIndex]}`;
            lineIndex++;
            setTimeout(printBootLog, 800);
        }
    }
    // Start boot simulation after initial load
    setTimeout(printBootLog, 1000);

    // Dynamic hover responses using JavaScript
    buttons.forEach(button => {
        button.addEventListener('mouseenter', () => {
            const infoText = button.getAttribute('data-info');
            logBox.innerHTML = `[NET_LOG] ${infoText}`;
            logBox.style.borderColor = window.getComputedStyle(button).borderColor;
        });

        button.forEach && button.addEventListener('mouseleave', () => {
            logBox.innerHTML = `[STATUS] System Idle. Selection logged.`;
            logBox.style.borderColor = "#38bdf8";
        });
    });
</script>

</body>
</html>
