<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUSHANT KHATRI // INTERSTELLAR DECK</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/welcome.css" />
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="scanlines"></div>

  <div id="welcome-gate" class="welcome-backdrop" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
    <div class="welcome-modal">
      <div class="welcome-tag">// WELCOME</div>
      <h2 id="welcome-title">WELCOME</h2>
      <p>
        Click <strong>Next</strong> to get in for the best experience.
      </p>
      <button id="welcome-next-btn" class="welcome-next" type="button">
        NEXT →
      </button>
    </div>
  </div>

  <main id="deck-panel" class="panel">
    <header class="header">
      <div id="sys-status">SYS_STATUS: STANDBY</div>
      <div id="flight-phase" class="flight-phase">FLOW: STANDBY</div>
      <div id="coord">GRID: X-00 // Y-00</div>
    </header>

    <h1>SUSHANT KHATRI</h1>
    <div class="subtitle">// INTERSTELLAR_NAV_DECK</div>

    <section id="hub-strip" class="hub-strip" aria-label="Ecosystem hubs"></section>

    <div class="hud" id="hud">
      [SYS] Awaiting entry...
    </div>

    <nav id="nav-grid" class="nav-grid" aria-label="Primary links"></nav>

    <div class="audio-controls">
      <button id="audio-toggle-btn" class="audio-toggle" type="button">
        🔊 SOUND: STANDBY
      </button>
      <a id="yt-fallback-link" class="yt-fallback" href="https://www.youtube.com/watch?v=K4DyBUG242c" target="_blank" rel="noopener noreferrer">
        Open Track on YouTube ↗
      </a>
    </div>
  </main>

  <div id="yt-audio-player" class="yt-embed-hidden" aria-hidden="true"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/audio-gate.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
